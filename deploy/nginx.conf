# Include this file from nginx.conf's http block.
map $http_upgrade $sameword_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    return 301 https://$http_host$request_uri;
    server_name sameword.example.com;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sameword.example.com;
    
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout  10m;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_certificate /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem; 

    root /path/to/same-word/dist/client;
    index index.html;

    expires off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $sameword_connection_upgrade;
    proxy_read_timeout 75s;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
