# Include this file from nginx.conf's http block.
map $http_upgrade $sameword_connection_upgrade {
    default upgrade;
    '' close;
}

map $request_uri $sameword_robots {
    default noindex;
    ~^/(\?.*)?$ "";
}

server {
    listen 80;
    return 301 https://$http_host$request_uri;
    server_name sameword.example.com;
    add_header X-Robots-Tag $sameword_robots always;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sameword.example.com;
    
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout  10m;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_certificate /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem; 

    root /path/to/same-word/dist/client;
    index index.html;

    add_header X-Robots-Tag $sameword_robots always;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript text/xml application/javascript application/json application/manifest+json application/xml image/svg+xml;

    expires off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $sameword_connection_upgrade;
    proxy_hide_header X-Robots-Tag;
    proxy_read_timeout 75s;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000;
    }

    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
        expires -1;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    location = /index.html {
        return 301 /;
    }

    location ~ "(?-i:^/rooms/[A-Z2-9]{6}$)" {
        try_files /index.html =404;
        expires -1;
    }

    location / {
        try_files $uri =404;
        expires -1;
    }
}
